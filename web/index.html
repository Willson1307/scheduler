<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!--
  F1 前端骨架 · 单页（AGENTS §8：单页，不做多页跳转、不做前端路由）
  🔴 零外链：不引 CDN、不引 npm 包、无构建步骤。现场必须断网能跑（赛事章程硬要求），
     任何外链都会在断网时崩掉，所以本文件只用相对路径引用同目录的 app.js。
  🔴 静态资源带版本号（AGENTS §8）：配合 static.py 的 no-cache + ETag，
     避免「改了 JS 但浏览器还在用旧版」——现场改样式时最易踩且极难排查。
     版本号由后端 config.ASSET_VERSION 统一导出，此处需与其保持一致。
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课表活动调度辅助系统</title>
<style>
  /* ===== 设计令牌：集中在此，页面其余处只引用变量 =====
     中文学术风格：白底、深蓝主色、红色系标冲突；无动画（现场投影可能不稳）。 */
  :root {
    --c-bg:        #f6f7f9;
    --c-surface:   #ffffff;
    --c-border:    #d8dee6;
    --c-border-st: #b9c2cd;
    --c-text:      #1f2733;
    --c-text-dim:  #5b6675;
    --c-primary:   #1f4e79;
    --c-primary-l: #e8eff6;
    --c-danger:    #c0392b;
    --c-danger-l:  #fdecea;
    --c-danger-b:  #e8a49b;
    --c-ok:        #1e7a4b;
    --c-ok-l:      #e8f5ee;
    --c-warn:      #9a6b00;
    --c-warn-l:    #fdf3e0;
    --fs-base:     17px;
    --fs-sm:       14px;
    --fs-xs:       12px;
    --sp:          12px;
    --radius:      6px;
  }

  /* 盒模型统一，避免 padding/border 把窄屏撑出横向滚动条 */
  *, *::before, *::after { box-sizing: border-box; }

  html { font-size: var(--fs-base); }
  body {
    margin: 0;
    padding: 0 0 40px;
    background: var(--c-bg);
    color: var(--c-text);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
    line-height: 1.6;
    /* 长串（掩码、id）必须允许换行，否则会把 body 撑宽 → 出现页面级横向滚动条 */
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 var(--sp); }

  /* ---------- 页头 ---------- */
  header {
    background: var(--c-primary);
    color: #fff;
    padding: 14px 0;
    margin-bottom: var(--sp);
  }
  header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: var(--fs-sm); opacity: .88; margin-top: 2px; }

  /* ---------- 工具条 ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;          /* 窄屏自动换行，不横滚 */
    gap: var(--sp);
    align-items: flex-end;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    padding: var(--sp);
    margin-bottom: var(--sp);
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > label { font-size: var(--fs-xs); color: var(--c-text-dim); }
  .field.grow { flex: 1 1 220px; }

  select, button, input {
    font: inherit;
    font-size: var(--fs-sm);
    padding: 7px 10px;
    border: 1px solid var(--c-border-st);
    border-radius: var(--radius);
    background: #fff;
    color: var(--c-text);
    max-width: 100%;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: var(--c-primary-l); }
  button:disabled { cursor: not-allowed; opacity: .55; }
  button.primary {
    background: var(--c-primary);
    border-color: var(--c-primary);
    color: #fff;
    font-weight: 700;
    /* 现场站着点，1 米可读 → 按钮加大 */
    padding: 10px 18px;
    font-size: 1rem;
  }
  button.primary:hover:not(:disabled) { background: #17405f; }
  button.danger {
    background: var(--c-danger);
    border-color: var(--c-danger);
    color: #fff;
    font-weight: 700;
    padding: 6px 12px;
  }
  button.danger:hover:not(:disabled) { background: #a5301f; }

  /* ---------- 区块 ---------- */
  section {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    padding: var(--sp);
    margin-bottom: var(--sp);
  }
  section > h2 {
    margin: 0 0 8px;
    font-size: 1.1rem;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px;
  }
  section > h2 .hint { font-size: var(--fs-xs); font-weight: 400; color: var(--c-text-dim); }
  .sec-head {
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .sec-head h2 { margin: 0; }

  /* ---------- 提示条 ---------- */
  .banner {
    border-radius: var(--radius);
    padding: 10px var(--sp);
    margin-bottom: var(--sp);
    font-size: var(--fs-sm);
    border: 1px solid;
  }
  .banner[hidden] { display: none; }
  .banner.error   { background: var(--c-danger-l); border-color: var(--c-danger-b); color: #7d2019; }
  .banner.ok      { background: var(--c-ok-l);     border-color: #a8d5bd;          color: #14512f; }
  .banner.warn    { background: var(--c-warn-l);   border-color: #e3c887;          color: #6d4c00; }
  .banner .t { font-weight: 700; }

  .empty {
    padding: 18px; text-align: center; color: var(--c-text-dim);
    font-size: var(--fs-sm); background: #fafbfc;
    border: 1px dashed var(--c-border-st); border-radius: var(--radius);
  }

  /* ---------- 周视图 ---------- */
  table.grid {
    width: 100%;
    table-layout: fixed;      /* 关键：固定列宽，窄屏不会被内容撑宽 */
    border-collapse: collapse;
    font-size: var(--fs-xs);
  }
  .grid th, .grid td {
    border: 1px solid var(--c-border);
    padding: 4px 5px;
    vertical-align: top;
    text-align: center;
    height: 46px;
  }
  .grid thead th { background: var(--c-primary-l); color: var(--c-primary); font-weight: 700; }
  .grid tbody th {
    background: #f2f4f7; color: var(--c-text-dim);
    font-weight: 600; width: 62px;
  }
  .grid td.hit {
    background: var(--c-danger-l);
    border-color: var(--c-danger-b);
    color: #7d2019;
    font-weight: 700;
  }
  .grid td .who { display: block; font-size: var(--fs-xs); line-height: 1.25; }
  .grid td .vs  { display: block; font-size: var(--fs-xs); font-weight: 400; color: #9c3a2c; }

  .masklist {
    margin-top: 10px; font-size: var(--fs-xs); color: var(--c-text-dim);
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    background: #eef1f5; border: 1px solid var(--c-border);
    max-width: 100%;
  }
  .chip.hit { background: var(--c-danger-l); border-color: var(--c-danger-b); color: #7d2019; font-weight: 700; }
  .chip code { font-family: Consolas, "Courier New", monospace; }

  /* ---------- 冲突列表 ---------- */
  .cl-head {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: space-between; margin-bottom: 8px;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat {
    padding: 4px 10px; border-radius: var(--radius);
    background: #eef1f5; border: 1px solid var(--c-border);
    font-size: var(--fs-sm);
  }
  .stat b { font-size: 1.1rem; }
  .stat.bad { background: var(--c-danger-l); border-color: var(--c-danger-b); color: #7d2019; }
  .stat.good { background: var(--c-ok-l); border-color: #a8d5bd; color: #14512f; }

  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items > li {
    border: 1px solid var(--c-danger-b);
    border-left: 5px solid var(--c-danger);
    border-radius: var(--radius);
    padding: 10px var(--sp);
    margin-bottom: 8px;
    background: #fffdfd;
  }
  .it-top {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
    justify-content: space-between;
  }
  .it-when { font-weight: 700; color: var(--c-danger); }
  .it-vs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
  .side {
    flex: 1 1 260px; min-width: 0;
    border: 1px solid var(--c-border); border-radius: var(--radius);
    padding: 6px 10px; background: #fff;
  }
  .side .nm { font-weight: 700; }
  .side .ti { color: var(--c-text-dim); font-size: var(--fs-sm); }
  .side .mt { font-size: var(--fs-xs); color: var(--c-text-dim); }
  /* 冲突条目尾部的槽位透传行（在 .side 之外，故单独给样式） */
  li > .mt { font-size: var(--fs-xs); color: var(--c-text-dim); margin-top: 4px; }
  .vs-mark { align-self: center; font-weight: 700; color: var(--c-danger); }

  .kind {
    display: inline-block; padding: 0 6px; border-radius: 8px;
    font-size: var(--fs-xs); background: #e7ebf0; color: var(--c-text-dim);
    border: 1px solid var(--c-border);
  }
  .kind.k-group   { background: var(--c-primary-l); color: var(--c-primary); }
  .kind.k-user    { background: var(--c-warn-l);   color: var(--c-warn); }
  .kind.k-resource{ background: var(--c-ok-l);     color: var(--c-ok); }
  /* 未知 kind 落.k-other（默认样式）→ 契约 §3/§12.2 第2、4 条：不内置白名单 */

  code, .mono { font-family: Consolas, "Courier New", monospace; }

  /* ---------- 消解结果 ---------- */
  .cmp {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    font-size: 1.05rem; font-weight: 700;
  }
  .cmp .from { color: var(--c-danger); text-decoration: line-through; }
  .cmp .to   { color: var(--c-ok); }
  .kv { margin-top: 8px; font-size: var(--fs-sm); color: var(--c-text-dim); }
  .kv div { padding: 1px 0; }

  .note { font-size: var(--fs-xs); color: var(--c-text-dim); margin: 6px 0 0; }
  /* 🔴 .note 用的是 <p>（display:block），不是 .banner 那种 div。
     之前只有 .banner[hidden] 这一条隐藏规则，导致 showBanner() 给 .note 设
     hidden=true 时**不生效**——口径说明会在没数据时也占一行空白。
     写这条兜底：所有用到 hidden 属性的元素都该有这条。
     （本项目第 8 次静默失效的同类：视觉层的 hidden 也不报错，只是默默不对） */
  [hidden] { display: none !important; }
  .mocktag {
    display: inline-block; padding: 1px 8px; border-radius: 8px;
    background: var(--c-warn-l); color: var(--c-warn);
    border: 1px solid #e3c887; font-size: var(--fs-xs); font-weight: 700;
  }
  footer { color: var(--c-text-dim); font-size: var(--fs-xs); text-align: center; margin-top: 16px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>课表活动调度辅助系统</h1>
    <div class="sub">
      课表（周期事务）与活动（一次性事务）同框· 统一冲突检测与一键消解
      <span id="srcTag" class="mocktag" hidden></span>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- 全局错误区：🔴 零容忍空白页——任何环节失败都在这里显式说出来，
       绝不让用户误以为「没有冲突」 -->
  <div id="fatal" class="banner error" role="alert" aria-live="assertive" hidden></div>

  <!-- ---------- 组切换器 ---------- -->
  <div class="toolbar">
    <div class="field grow">
      <label for="groupSel">当前组（只列出你有授权的组）</label>
      <select id="groupSel"><option value="">加载中…</option></select>
    </div>
    <div class="field">
      <label for="weekSel">周（缺省＝本周，服务端以周一为起点归周）</label>
      <input id="weekSel" type="text" inputmode="numeric" placeholder="YYYY-MM-DD，留空＝本周" size="12">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button id="reloadBtn" type="button">重新加载</button>
    </div>
  </div>

  <!-- ---------- 周视图 ---------- -->
  <section id="secWeek">
    <div class="sec-head">
      <h2>周视图 <span class="hint">周一 ~ 周五 × 第 1 ~ 10 节</span></h2>
      <div class="field">
        <label for="objSel">查看对象</label>
        <select id="objSel"></select>
      </div>
    </div>
    <div id="weekErr" class="banner error" role="alert" hidden></div>
    <div id="weekBox"></div>
    <p class="note">
      格子内容来自后端下发的<code>readable</code>（可读节次），<b>前端不解码槽位掩码</b>；
      下方「每日占用」按掩码原样透传显示（<code>0x…</code>），不做位运算、不做字符串比较。
    </p>
  </section>

  <!-- ---------- 冲突列表 ---------- -->
  <section id="secConflict">
    <div class="cl-head">
      <h2>冲突列表 <span class="hint">硬冲突必须消解</span></h2>
      <div>
        <button id="resolveBtn" class="primary" type="button">一键消解（当前组）</button>
      </div>
    </div>
    <div id="confErr" class="banner error" role="alert" hidden></div>
    <div id="confBox"></div>
    <p class="note" id="resolveHint"></p>
  </section>

  <!-- ---------- 消解前后对比 ---------- -->
  <section id="secResult">
    <h2>消解结果 <span class="hint">从 → 到，均读自接口响应，不在前端写死</span></h2>
    <div id="resBox"><div class="empty">尚未执行消解。</div></div>
  </section>

  <footer>
    本地运行 · 断网可用 · 零第三方依赖 · 前端不做位运算、动态文本一律 textContent
  </footer>
</div>

<!-- 版本号与后端 config.ASSET_VERSION 对齐；相对路径，无外链 -->
<script src="app.js?v=20261003"></script>
</body>
</html>
